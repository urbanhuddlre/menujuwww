<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TUH WWW</title>
    
    <!-- Firebase SDK (v8 Compatibility Mode) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        @font-face {
            font-family: 'Hillios';
            src: url('Hillios.otf') format('opentype');
        }

        h1 { font-family: 'Hillios', sans-serif !important; }

        :root {
            --accent-color: #e95500;
            --bg-color: #f6f6f9;
            --text-color: #555555;
            --lane-color: #ffee9b;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }

        body {
            margin: 0; padding: 0;
            font-family: 'Poppins', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            width: 100vw; height: 100vh;
            overflow: hidden;
            display: flex; justify-content: center; align-items: center;
        }

        #game-container {
            width: 100vw; height: 100vh;
            max-width: 480px; max-height: 100vh;
            background: #ffffff;
            position: relative;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
            display: flex; flex-direction: column;
            overflow: hidden;
        }

        .logo-wrapper {
            width: 130px; height: 130px;
            display: flex; justify-content: center; align-items: center;
            margin-bottom: 15px;
        }

        .logo-wrapper img {
            width: 100%; height: 100%; object-fit: contain;
            filter: drop-shadow(0 4px 10px rgba(233, 85, 0, 0.3));
        }

        #main-menu, #result-screen, #leaderboard-modal {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(8px);
            z-index: 9999 !important;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            padding: 20px;
        }

        #game-screen {
            display: none; width: 100%; height: 100%; position: relative;
        }

        .btn {
            background: #ffef9a; color: #e95402;
            border: none; padding: 14px 28px;
            font-size: 16px; font-weight: 800;
            border-radius: 25px; cursor: pointer !important;
            pointer-events: auto !important;
            box-shadow: 0 8px 25px rgba(52, 71, 253, 0.4);
            transition: transform 0.1s; margin: 8px 0;
            width: 80%; max-width: 250px; text-align: center;
            position: relative; z-index: 10000 !important;
            font-family: 'Poppins', sans-serif;
        }

        .btn:active { transform: scale(0.95); }

        .hud {
            position: absolute; top: 20px; left: 20px; right: 20px;
            display: flex; justify-content: space-between;
            font-weight: 800; font-size: 18px;
            color: var(--accent-color); z-index: 10;
        }

        #judgment-text {
            position: absolute; top: 40%; left: 50%;
            transform: translate(-50%, -50%);
            font-size: 32px; font-weight: 900;
            opacity: 0; transition: opacity 0.1s;
            z-index: 10; pointer-events: none;
        }

        .track-container {
            display: flex; width: 100%; height: 100%; position: relative;
        }

        .lane {
            flex: 1; border-right: 1px dashed #eee;
            position: relative; height: 100%; overflow: hidden;
        }

        .lane:last-child { border-right: none; }

        .heart-key {
            position: absolute; bottom: 120px; left: 50%;
            transform: translateX(-50%);
            width: 50px; height: 50px;
            border-radius: 50%;
            border: 3px solid var(--accent-color);
            display: flex; align-items: center; justify-content: center;
            font-size: 20px; color: var(--accent-color);
            background: white; box-shadow: 0 4px 10px rgba(233, 85, 0, 0.2);
            pointer-events: none; z-index: 5;
        }

        .heart-key.active-press {
            background: var(--accent-color) !important;
            color: white !important;
            transform: translateX(-50%) scale(1.15) !important;
            box-shadow: 0 0 20px var(--accent-color) !important;
            transition: transform 0.05s ease, background 0.05s ease;
        }

        #svg-layer {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none; z-index: 2;
        }

        .note {
            position: absolute; width: 36px; height: 36px;
            margin-left: -18px; margin-top: -18px;
            background: #adc642; border-radius: 50%;
            box-shadow: 0 0 10px rgba(233, 85, 0, 0.5);
            z-index: 3; pointer-events: none;
        }

        .result-box {
            background: #ffffff; border: 2px solid #f0f0f5;
            padding: 30px 24px; border-radius: 30px;
            width: 85%; max-width: 360px; text-align: center;
            box-shadow: 0 20px 40px rgba(233, 85, 0, 0.15);
        }

        .score-big {
            font-size: 36px; font-weight: 900;
            margin: 5px 0 15px 0; color: var(--accent-color);
        }

        .stats-container {
            display: flex; justify-content: space-between;
            gap: 8px; margin-bottom: 20px;
        }

        .stat-pill {
            flex: 1; padding: 10px 4px; border-radius: 15px;
            font-size: 11px; font-weight: 800; background: #f8f8fc;
            display: flex; flex-direction: column; gap: 4px;
        }

        .stat-pill span { font-size: 18px; }
        .stat-pill.perfect { color: #e70171; }
        .stat-pill.good { color: #ffb800; }
        .stat-pill.miss { color: #888888; }

        #username-input {
            width: 100%; padding: 12px 16px;
            border: 2px solid #f0f0f5; border-radius: 20px;
            outline: none; font-size: 14px; font-weight: 700;
            text-align: center; background: #f8f8fc;
            margin-bottom: 15px; pointer-events: auto !important;
            font-family: 'Poppins', sans-serif;
        }

        #username-input:focus { border-color: var(--accent-color); background: #fff; }
    </style>
</head>
<body>

<div id="game-container">
    <audio id="bgm" src="music.mp3" preload="auto"></audio>

    <!-- 1. MAIN MENU -->

        </div>
        <button id="play-btn" class="btn" onclick="startGame()">PLAY GAME</button>

    </div>

    <!-- 2. GAME PLAY SCREEN -->
    <div id="game-screen">
        <div class="hud">
            <div>SCORE: <span id="score">0</span></div>

        <div id="judgment-text">PERFECT</div>

        <div class="track-container">
            <svg id="svg-layer"></svg>
            <div class="lane" data-lane="0"><div class="heart-key">♥</div></div>
            <div class="lane" data-lane="1"><div class="heart-key">♥</div></div>
            <div class="lane" data-lane="2"><div class="heart-key">♥</div></div>
            <div class="lane" data-lane="3"><div class="heart-key">♥</div></div>
        </div>
    </div>

    <!-- 3. RESULT SCREEN -->
    <div id="result-screen" style="display: none;">
        <div class="result-box">
            <h2 id="result-title" style="margin: 0; color: var(--accent-color);">CONGRATS!</h2>

            <div id="res-score" class="score-big">0</div>

            <div class="stats-container">
                <div class="stat-pill perfect">PERFECT <span id="res-perfect">0</span></div>
                <div class="stat-pill good">GOOD <span id="res-good">0</span></div>
                <div class="stat-pill miss">MISS <span id="res-miss">0</span></div>
            </div>

            <input type="text" id="username-input" placeholder="Masukkan Nama Kamu..." maxlength="12">
            <button class="btn" onclick="saveScoreAndExit()">SUBMIT SCORE</button>

    <!-- 4. LEADERBOARD MODAL -->
    <div id="leaderboard-modal" style="display: none;">
        <div class="result-box" style="max-width: 400px; max-height: 80vh;">
            <h2 style="margin: 0 0 15px 0; color: var(--accent-color);">LEADERBOARD</h2>
            <div id="leaderboard-list" style="width:100%; max-height:250px; overflow-y:auto; margin-bottom: 15px; text-align: left; padding-right: 5px;">
                <p style="text-align:center;">Memuat data...</p>
            </div>
            <button class="btn" onclick="toggleLeaderboard(false)">KEMBALI</button>
        </div>
    </div>
</div>

<script>
// ==========================================
// 1. INISIALISASI FIREBASE
// ==========================================
const firebaseConfig = {
  apiKey: "AIzaSyDUsMS5tfT9D1uPB3goNOV8B7h0GxIXKTE",
  authDomain: "tuh-34252.firebaseapp.com",
  databaseURL: "https://tuh-34252-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "tuh-34252",
  storageBucket: "tuh-34252.firebasestorage.app",
  messagingSenderId: "617954231350",
  appId: "1:617954231350:web:f1680856f37dc8e87cc497",
  measurementId: "G-MNE05FGWNB"
};

let isFirebaseReady = false;
try {
    firebase.initializeApp(firebaseConfig);
    isFirebaseReady = true;
} catch(e) {
    console.error("Gagal menginisialisasi Firebase:", e);
}

// ==========================================
// 2. VARIABEL GLOBAL GAME & BEATMAP
// ==========================================
let score = 0;
let combo = 0;
let isPlaying = false;
let gameAnimFrame = null;
let perfectCount = 0;
let goodCount = 0;
let missCount = 0;
let activeNotes = [];
let activeTouches = {}; // Melacak sentuhan jari aktif

const bgm = document.getElementById('bgm');
const FALL_SPEED = 400; // Kecepatan jatuh note (pixel / detik)

// BEATMAP DENGAN HOLD NOTE & ZIGZAG (Contoh bagian yank yankkkk)
let beatmap = [
  // --- Intro ---
  { id: 1, time: 1.0, type: 'tap', lane: 0 },
  { id: 2, time: 1.4, type: 'tap', lane: 1 },
  { id: 3, time: 1.8, type: 'tap', lane: 2 },
  { id: 4, time: 2.2, type: 'tap', lane: 3 },
  
  // --- Hold Note Zigzag di bagian "Yank Yankkkk" ---
  { 
    id: 5, 
    time: 3.5, 
    type: 'hold', 
    duration: 3.0, 
    // Path Zigzag: Lane urut dari 0 -> 1 -> 2 -> 3 -> 2 -> 1 -> 0
    path: [
      { t: 0.0, lane: 0 },
      { t: 0.5, lane: 1 },
      { t: 1.0, lane: 2 },
      { t: 1.5, lane: 3 },
      { t: 2.0, lane: 2 },
      { t: 2.5, lane: 1 },
      { t: 3.0, lane: 0 }
    ]
  },

  { id: 6, time: 7.0, type: 'tap', lane: 1 },
  { id: 7, time: 7.5, type: 'tap', lane: 2 },

  // --- Hold Zigzag kedua ---
  { 
    id: 8, 
    time: 8.5, 
    type: 'hold', 
    duration: 2.5, 
    path: [
      { t: 0.0, lane: 3 },
      { t: 0.6, lane: 1 },
      { t: 1.2, lane: 2 },
      { t: 1.8, lane: 0 },
      { t: 2.5, lane: 3 }
    ]
  }
];

// ==========================================
// 3. FUNGSI UTAMA GAME & ENGINE
// ==========================================
function getLaneX(laneIndex) {
    const container = document.getElementById('game-container');
    const width = container.clientWidth;
    const laneWidth = width / 4;
    return (laneIndex + 0.5) * laneWidth;
}

function getHitY() {
    return window.innerHeight - 145; // Posisi vertikal heart-key
}

function startGame() {
    document.getElementById('main-menu').style.display = 'none';
    document.getElementById('result-screen').style.display = 'none';
    document.getElementById('leaderboard-modal').style.display = 'none';
    document.getElementById('game-screen').style.display = 'block';

    score = 0; combo = 0; perfectCount = 0; goodCount = 0; missCount = 0;
    activeNotes = [];
    activeTouches = {};
    document.querySelectorAll('.note').forEach(n => n.remove());
    document.getElementById('svg-layer').innerHTML = '';

    beatmap.forEach(n => {
        n.spawned = false;
        n.hit = false;
        n.holding = false;
        n.completed = false;
        n.missed = false;
        n.lastTick = 0;
    });

    isPlaying = true;
    updateHUD();

    if (bgm) {
        bgm.currentTime = 0;
        bgm.play().catch(() => {});
    }

    const startTime = Date.now();

    function gameLoop() {
        if (!isPlaying) return;
        const currentTime = (Date.now() - startTime) / 1000;

        // Spawn notes
        beatmap.forEach(note => {
            if (!note.spawned && currentTime >= note.time) {
                spawnNote(note);
                note.spawned = true;
            }
        });

        // Update Posisi & Status Note
        updateNotes(currentTime);

        if (currentTime >= 20) { // Durasi game
            endGame('congrats');
            return;
        }

        gameAnimFrame = requestAnimationFrame(gameLoop);
    }

    if (gameAnimFrame) cancelAnimationFrame(gameAnimFrame);
    gameAnimFrame = requestAnimationFrame(gameLoop);
}

function spawnNote(noteData) {
    if (noteData.type === 'tap') {
        const el = document.createElement('div');
        el.className = 'note';
        document.getElementById('game-screen').appendChild(el);
        noteData.el = el;
    } else if (noteData.type === 'hold') {
        const svg = document.getElementById('svg-layer');
        const pathEl = document.createElementNS("http://www.w3.org/2000/svg", "path");
        pathEl.setAttribute("stroke", "#e95500");
        pathEl.setAttribute("stroke-width", "28");
        pathEl.setAttribute("fill", "none");
        pathEl.setAttribute("stroke-linecap", "round");
        pathEl.setAttribute("opacity", "0.8");
        svg.appendChild(pathEl);
        noteData.pathEl = pathEl;

        const headEl = document.createElement('div');
        headEl.className = 'note';
        document.getElementById('game-screen').appendChild(headEl);
        noteData.headEl = headEl;
    }
    activeNotes.push(noteData);
}

function getCurrentLaneForHold(note, relativeTime) {
    const path = note.path;
    if (relativeTime <= 0) return path[0].lane;
    if (relativeTime >= note.duration) return path[path.length - 1].lane;

    for (let i = 0; i < path.length - 1; i++) {
        if (relativeTime >= path[i].t && relativeTime <= path[i+1].t) {
            const progress = (relativeTime - path[i].t) / (path[i+1].t - path[i].t);
            return path[i].lane + (path[i+1].lane - path[i].lane) * progress;
        }
    }
    return path[0].lane;
}

function updateNotes(currentTime) {
    const hitY = getHitY();

    activeNotes.forEach(note => {
        if (note.completed || note.missed) return;

        if (note.type === 'tap') {
            const elapsed = currentTime - note.time;
            const currentY = hitY - (FALL_SPEED * (0 - elapsed));
            note.el.style.top = currentY + 'px';
            note.el.style.left = getLaneX(note.lane) + 'px';

            // Automiss kalau terlewat
            if (currentY > hitY + 60 && !note.hit) {
                note.missed = true;
                note.el.remove();
                triggerJudgment('MISS');
            }
        } 
        else if (note.type === 'hold') {
            const headElapsed = currentTime - note.time;
            const headY = hitY + (headElapsed * FALL_SPEED);

            // Gambar Jalur SVG Zigzag
            let d = "";
            const samples = 30;
            for (let i = 0; i <= samples; i++) {
                const stepT = (note.duration / samples) * i;
                const sampleLane = getCurrentLaneForHold(note, stepT);
                const x = getLaneX(sampleLane);
                const nodeElapsed = currentTime - (note.time + stepT);
                const y = hitY + (nodeElapsed * FALL_SPEED);

                // Potong bagian bawah jika sedang di-hold
                if (note.holding && y > hitY) {
                    d += (i === 0 ? "M" : "L") + " " + x + " " + hitY + " ";
                } else {
                    d += (i === 0 ? "M" : "L") + " " + x + " " + y + " ";
                }
            }
            note.pathEl.setAttribute("d", d);

            // Posisi Kepala Note
            const currentHeadLane = getCurrentLaneForHold(note, Math.max(0, headElapsed));
            note.headEl.style.left = getLaneX(currentHeadLane) + 'px';
            note.headEl.style.top = Math.min(headY, hitY) + 'px';

            // Pengecekan posisi jari saat hold
            if (note.holding) {
                const targetLane = getCurrentLaneForHold(note, headElapsed);
                const targetX = getLaneX(targetLane);
                let touchHolding = false;

                // Verifikasi apakah ada jari di area target
                for (let id in activeTouches) {
                    if (Math.abs(activeTouches[id].x - targetX) < 60) {
                        touchHolding = true;
                        break;
                    }
                }

                if (touchHolding) {
                    // Tambahkan skor bertahap saat menahan
                    if (currentTime - note.lastTick > 0.1) {
                        score += 15;
                        combo++;
                        updateHUD();
                        note.lastTick = currentTime;
                    }
                } else {
                    // Jari terlepas / keluar dari pola zigzag
                    note.holding = false;
                    note.missed = true;
                    triggerJudgment('MISS');
                    cleanHoldNote(note);
                }
            }

            // Selesai hold
            if (headElapsed >= note.duration) {
                if (note.holding) {
                    triggerJudgment('PERFECT');
                }
                note.completed = true;
                cleanHoldNote(note);
            } else if (headY > hitY + 80 && !note.holding) {
                note.missed = true;
                triggerJudgment('MISS');
                cleanHoldNote(note);
            }
        }
    });
}

function cleanHoldNote(note) {
    if (note.pathEl) note.pathEl.remove();
    if (note.headEl) note.headEl.remove();
}

// ==========================================
// 4. MULTI-TOUCH & INPUT HANDLING
// ==========================================
function setupTouchEvents() {
    const gameScreen = document.getElementById('game-screen');

    const processTouchStart = (id, x, y) => {
        activeTouches[id] = { x, y };
        const hitY = getHitY();

        // Visual efek tombol di tekan
        const laneIndex = Math.floor(x / (window.innerWidth / 4));
        const lanes = document.querySelectorAll('.lane');
        if (lanes[laneIndex]) {
            const key = lanes[laneIndex].querySelector('.heart-key');
            if (key) {
                key.classList.add('active-press');
                setTimeout(() => key.classList.remove('active-press'), 100);
            }
        }

        // Pengecekan Hit Note
        activeNotes.forEach(note => {
            if (note.completed || note.missed) return;

            if (note.type === 'tap' && !note.hit) {
                const noteX = getLaneX(note.lane);
                const noteY = parseFloat(note.el.style.top || 0);
                const dist = Math.abs(noteY - hitY);

                if (Math.abs(x - noteX) < 40 && dist <= 80) {
                    note.hit = true;
                    note.completed = true;
                    note.el.remove();
                    triggerJudgment(dist <= 40 ? 'PERFECT' : 'GOOD');
                }
            } else if (note.type === 'hold' && !note.holding) {
                const startX = getLaneX(note.path[0].lane);
                const noteY = parseFloat(note.headEl.style.top || 0);
                const dist = Math.abs(noteY - hitY);

                if (Math.abs(x - startX) < 50 && dist <= 80) {
                    note.holding = true;
                    triggerJudgment('PERFECT');
                }
            }
        });
    };

    const processTouchMove = (id, x, y) => {
        if (activeTouches[id]) {
            activeTouches[id] = { x, y };
        }
    };

    const processTouchEnd = (id) => {
        delete activeTouches[id];
    };

    // Event Touch Screen
    gameScreen.addEventListener('touchstart', (e) => {
        e.preventDefault();
        for (let i = 0; i < e.changedTouches.length; i++) {
            const t = e.changedTouches[i];
            processTouchStart(t.identifier, t.clientX, t.clientY);
        }
    }, { passive: false });

    gameScreen.addEventListener('touchmove', (e) => {
        e.preventDefault();
        for (let i = 0; i < e.changedTouches.length; i++) {
            const t = e.changedTouches[i];
            processTouchMove(t.identifier, t.clientX, t.clientY);
        }
    }, { passive: false });

    gameScreen.addEventListener('touchend', (e) => {
        for (let i = 0; i < e.changedTouches.length; i++) {
            processTouchEnd(e.changedTouches[i].identifier);
        }
    });

    // Fallback Mouse Support
    let isMouseDown = false;
    gameScreen.addEventListener('mousedown', (e) => {
        isMouseDown = true;
        processTouchStart('mouse', e.clientX, e.clientY);
    });
    gameScreen.addEventListener('mousemove', (e) => {
        if (isMouseDown) processTouchMove('mouse', e.clientX, e.clientY);
    });
    gameScreen.addEventListener('mouseup', () => {
        isMouseDown = false;
        processTouchEnd('mouse');
    });
}

function triggerJudgment(type) {
    const el = document.getElementById('judgment-text');
    if (!el) return;

    if (type === 'PERFECT') {
        el.innerText = 'PERFECT'; el.style.color = '#ff4081';
        score += 100; combo++; perfectCount++;
    } else if (type === 'GOOD') {
        el.innerText = 'GOOD'; el.style.color = '#ffb800';
        score += 50; combo++; goodCount++;
    } else {
        el.innerText = 'MISS'; el.style.color = '#888888';
        combo = 0; missCount++;
        if (missCount >= 20) endGame('gameover');
    }

    el.style.opacity = '1';
    setTimeout(() => { el.style.opacity = '0'; }, 200);
    updateHUD();
}

function updateHUD() {
    const scoreEl = document.getElementById('score');
    const comboEl = document.getElementById('combo');
    if (scoreEl) scoreEl.innerText = score.toLocaleString();
    if (comboEl) comboEl.innerText = combo;
}

function endGame(status) {
    isPlaying = false;
    if (gameAnimFrame) cancelAnimationFrame(gameAnimFrame);
    if (bgm) bgm.pause();

    document.getElementById('game-screen').style.display = 'none';
    document.getElementById('result-title').innerText = status === 'congrats' ? "CONGRATS!" : "GAME OVER";
    document.getElementById('res-score').innerText = score.toLocaleString();
    document.getElementById('res-perfect').innerText = perfectCount;
    document.getElementById('res-good').innerText = goodCount;
    document.getElementById('res-miss').innerText = missCount;
    document.getElementById('result-screen').style.display = 'flex';
}

// ==========================================
// 5. FIREBASE SAVE & FETCH LEADERBOARD
// ==========================================
function saveScoreAndExit() {
    const inputEl = document.getElementById('username-input');
    const username = (inputEl && inputEl.value.trim() !== "") ? inputEl.value.trim() : "Player";

    const scoreData = {
        username: username, score: score,
        perfect: perfectCount, good: goodCount, miss: missCount,
        timestamp: Date.now()
    };

    if (!isFirebaseReady) {
        document.getElementById('result-screen').style.display = 'none';
        document.getElementById('main-menu').style.display = 'flex';
        return;
    }

    try {
        firebase.database().ref('leaderboard').push(scoreData)
            .then(() => {
                document.getElementById('result-screen').style.display = 'none';
                toggleLeaderboard(true);
            })
            .catch(() => {
                document.getElementById('result-screen').style.display = 'none';
                document.getElementById('main-menu').style.display = 'flex';
            });
    } catch(e) {
        document.getElementById('result-screen').style.display = 'none';
        document.getElementById('main-menu').style.display = 'flex';
    }
}

function toggleLeaderboard(show) {
    const modal = document.getElementById('leaderboard-modal');
    const mainMenu = document.getElementById('main-menu');
    
    if (show) {
        if (mainMenu) mainMenu.style.display = 'none';
        if (modal) modal.style.display = 'flex';
        fetchGlobalScores();
    } else {
        if (modal) modal.style.display = 'none';
        if (mainMenu) mainMenu.style.display = 'flex';
    }
}

function fetchGlobalScores() {
    const listEl = document.getElementById('leaderboard-list');
    if (!listEl) return;
    listEl.innerHTML = "<p style='text-align:center;'>Memuat data global...</p>";

    if (!isFirebaseReady) {
        listEl.innerHTML = "<p style='text-align:center; color:red;'>Koneksi ke Firebase gagal.</p>";
        return;
    }

    try {
        firebase.database().ref('leaderboard').once('value', (snapshot) => {
            let dataArr = [];
            snapshot.forEach(child => { dataArr.push(child.val()); });
            dataArr.sort((a, b) => b.score - a.score);

            if (dataArr.length === 0) {
                listEl.innerHTML = "<p style='text-align:center;'>Belum ada skor global tersimpan.</p>";
                return;
            }

            let html = "";
            dataArr.slice(0, 10).forEach((item, index) => {
                html += `
                    <div style="display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px solid #eee; font-size:14px;">
                        <span>#${index+1} <b>${item.username || 'Player'}</b></span>
                        <span style="color:var(--accent-color); font-weight:bold;">${(item.score || 0).toLocaleString()}</span>
                    </div>
                `;
            });
            listEl.innerHTML = html;
        });
    } catch(e) {
        listEl.innerHTML = "<p style='text-align:center; color:red;'>Terjadi kesalahan koneksi.</p>";
    }
}

document.addEventListener('DOMContentLoaded', () => {
    setupTouchEvents();
});
</script>
