    <style>

        .heart-key.active-press {

            box-shadow: 0 0 20px var(--accent-color) !important;
            transition: transform 0.05s ease, background 0.05s ease;

        .note {
            position: absolute;

            background: var(--accent-color);

                <p style="text-align:center;">Memuat data...</p>

        </div>

</div>

<script>
// ==========================================

// ==========================================
// 2. VARIABEL GLOBAL GAME & BEATMAP
// ==========================================
let score = 0;
let combo = 0;
let isPlaying = false;
let gameInterval = null;
let perfectCount = 0;
let goodCount = 0;
let missCount = 0;

const bgm = document.getElementById('bgm');

// Beatmap diperkerat (kecepatan jatuh/durasi dinaikkan & kerapatan dipadatkan)
let beatmap = [
  // --- Intro Fast Beat ---

  { time: 11.000, lane: 1 }, { time: 11.250, lane: 2 }, { time: 11.500, lane: 0 }, { time: 11.500, lane: 3 }, // Double
  { time: 12.000, lane: 2 }, { time: 12.250, lane: 1 }, { time: 12.500, lane: 3 }, { time: 12.750, lane: 0 },
  { time: 13.000, lane: 1 }, { time: 13.250, lane: 2 }, { time: 13.500, lane: 0 }, { time: 13.750, lane: 3 },
  { time: 14.000, lane: 1 }, { time: 14.250, lane: 2 }, { time: 14.500, lane: 0 }, { time: 14.800, lane: 3 },

  { time: 18.600, lane: 1 }, { time: 18.850, lane: 2 }, { time: 19.100, lane: 0 }, { time: 19.350, lane: 3 },
  { time: 19.600, lane: 1 }, { time: 19.850, lane: 2 }, { time: 20.100, lane: 0 }, { time: 20.350, lane: 3 },
  { time: 20.600, lane: 1 }, { time: 20.850, lane: 2 }, { time: 21.100, lane: 0 }, { time: 21.100, lane: 2 }, // Double

  { time: 21.600, lane: 1 }, { time: 21.850, lane: 3 }, { time: 22.100, lane: 0 }, { time: 22.350, lane: 2 },

  { time: 23.600, lane: 1 }, { time: 23.850, lane: 0 }, { time: 24.100, lane: 2 }, { time: 24.350, lane: 3 },
  { time: 24.600, lane: 0 }, { time: 24.600, lane: 3 }, // Double
  { time: 25.000, lane: 1 }, { time: 25.250, lane: 2 }, { time: 25.500, lane: 0 }, { time: 25.750, lane: 3 },
  { time: 26.000, lane: 1 }, { time: 26.250, lane: 2 }, { time: 26.500, lane: 0 }, { time: 26.750, lane: 3 },

  // --- Outro / Rapid Drop ---
  { time: 27.200, lane: 0 }, { time: 27.400, lane: 1 }, { time: 27.600, lane: 2 }, { time: 27.800, lane: 3 },
  { time: 28.000, lane: 2 }, { time: 28.200, lane: 1 }, { time: 28.400, lane: 0 }, { time: 28.600, lane: 3 },
  { time: 28.800, lane: 1 }, { time: 29.000, lane: 2 }, { time: 29.200, lane: 0 }, { time: 29.200, lane: 3 }, // Double
  { time: 29.600, lane: 1 }, { time: 29.800, lane: 2 }, { time: 30.000, lane: 0 }, { time: 30.000, lane: 3 }  // Double Final
];

// ==========================================
// 3. FUNGSI LOGIKA GAME & MULTI-TOUCH
// ==========================================
function startGame() {
    const mainMenu = document.getElementById('main-menu');
    const resultScreen = document.getElementById('result-screen');
    const leaderboardModal = document.getElementById('leaderboard-modal');
    const gameScreen = document.getElementById('game-screen');

    if (mainMenu) mainMenu.style.display = 'none';
    if (resultScreen) resultScreen.style.display = 'none';
    if (leaderboardModal) leaderboardModal.style.display = 'none';
    if (gameScreen) gameScreen.style.display = 'block';
    
    score = 0;
    combo = 0;
    perfectCount = 0;
    goodCount = 0;
    missCount = 0;
    
    document.querySelectorAll('.note').forEach(n => n.remove());
    beatmap.forEach(n => n.spawned = false);

    isPlaying = true;
    updateHUD();

    if (bgm) {
        bgm.currentTime = 0;
        bgm.play().catch(() => {});
    }

    if (gameInterval) clearInterval(gameInterval);
    const startTime = Date.now();

    gameInterval = setInterval(() => {
        if (!isPlaying) return;

        const elapsedTime = (Date.now() - startTime) / 1000; // konversi ke detik

        beatmap.forEach(note => {
            if (!note.spawned && elapsedTime >= note.time) {
                spawnNoteDOM(note.lane);
                note.spawned = true;
            }
        });

        document.querySelectorAll('.note').forEach(noteEl => {
            const rect = noteEl.getBoundingClientRect();
            if (rect.top > window.innerHeight - 50) {
                noteEl.remove();
                triggerJudgment('MISS');
            }
        });

        if (elapsedTime >= 35) {
            endGame('congrats');
        }
    }, 20);
}

function spawnNoteDOM(laneIndex) {
    const lanes = document.querySelectorAll('.lane');
    if (!lanes[laneIndex]) return;

    const noteEl = document.createElement('div');
    noteEl.className = 'note';
    lanes[laneIndex].appendChild(noteEl);
}

// Multi-Touch Handlers untuk Dukungan Double Hit
function setupTouchEvents() {
    const track = document.querySelector('.track-container');
    if (!track) return;

    const handleInput = (clientX, clientY) => {
        const lanes = document.querySelectorAll('.lane');
        lanes.forEach((lane, index) => {
            const rect = lane.getBoundingClientRect();
            if (clientX >= rect.left && clientX <= rect.right && clientY >= rect.top && clientY <= rect.bottom) {
                hitLane(index);
            }
        });
    };

    track.addEventListener('touchstart', (e) => {
        e.preventDefault();
        for (let i = 0; i < e.changedTouches.length; i++) {
            handleInput(e.changedTouches[i].clientX, e.changedTouches[i].clientY);
        }
    }, { passive: false });

    track.addEventListener('mousedown', (e) => {
        handleInput(e.clientX, e.clientY);
    });
}

function hitLane(laneIndex) {
    if (!isPlaying) return;

    const lanes = document.querySelectorAll('.lane');
    const currentLane = lanes[laneIndex];
    if (!currentLane) return;

    const heartKey = currentLane.querySelector('.heart-key');
    if (heartKey) {
        heartKey.classList.add('active-press');
        setTimeout(() => {
            heartKey.classList.remove('active-press');
        }, 100);
    }

    const activeNotes = currentLane.querySelectorAll('.note');
    if (activeNotes.length === 0) return;

    const targetNote = activeNotes[0];
    if (!targetNote || !heartKey) return;

    const noteRect = targetNote.getBoundingClientRect();
    const heartRect = heartKey.getBoundingClientRect();

    const noteCenter = noteRect.top + (noteRect.height / 2);
    const heartCenter = heartRect.top + (heartRect.height / 2);
    const distance = Math.abs(noteCenter - heartCenter);

    if (distance <= 40) {
        targetNote.remove();
        triggerJudgment('PERFECT');
    } else if (distance <= 80) {
        targetNote.remove();
        triggerJudgment('GOOD');
    }
}

function triggerJudgment(type) {
    const el = document.getElementById('judgment-text');
    
    if (type === 'PERFECT') {
        if (el) {
            el.innerText = 'PERFECT';
            el.style.color = '#e95500';
            el.style.opacity = '1';
            setTimeout(() => { el.style.opacity = '0'; }, 200);
        }
        score += 100;
        combo++;
        perfectCount++;
    } else if (type === 'GOOD') {
        if (el) {
            el.innerText = 'GOOD';
            el.style.color = '#ffb800';
            el.style.opacity = '1';
            setTimeout(() => { el.style.opacity = '0'; }, 200);
        }
        score += 50;
        combo++;
        goodCount++;
    } else {
        if (el) {
            el.innerText = 'MISS';
            el.style.color = '#888888';
            el.style.opacity = '1';
            setTimeout(() => { el.style.opacity = '0'; }, 200);
        }
        combo = 0;
        missCount++;

        if (missCount >= 20) {
            endGame('gameover');
            return;
        }
    }

    updateHUD();
}

function updateHUD() {
    const scoreEl = document.getElementById('score');
    const comboEl = document.getElementById('combo');
    if (scoreEl) scoreEl.innerText = score.toLocaleString();
    if (comboEl) comboEl.innerText = combo;
}

function endGame(status) {
    isPlaying = false;
    clearInterval(gameInterval);
    if (bgm) bgm.pause();

    document.getElementById('game-screen').style.display = 'none';
    
    const titleEl = document.getElementById('result-title');
    if (status === 'congrats') {
        titleEl.innerText = "CONGRATS!";
    } else {
        titleEl.innerText = "GAME OVER";
    }

    document.getElementById('res-score').innerText = score.toLocaleString();
    document.getElementById('res-perfect').innerText = perfectCount;
    document.getElementById('res-good').innerText = goodCount;
    document.getElementById('res-miss').innerText = missCount;
    
    const inputEl = document.getElementById('username-input');
    if (inputEl) inputEl.value = '';
    
    document.getElementById('result-screen').style.display = 'flex';
}

// ==========================================
// 4. FIREBASE SAVE & FETCH LEADERBOARD
// ==========================================
function saveScoreAndExit() {
    const inputEl = document.getElementById('username-input');
    const username = (inputEl && inputEl.value.trim() !== "") ? inputEl.value.trim() : "Player";

    const scoreData = {
        username: username,
        score: score,
        perfect: perfectCount,
        good: goodCount,
        miss: missCount,
        timestamp: Date.now()
    };

    if (!isFirebaseReady) {
        document.getElementById('result-screen').style.display = 'none';
        document.getElementById('main-menu').style.display = 'flex';
        return;
    }

    try {
        firebase.database().ref('leaderboard').push(scoreData)
            .then(() => {
                document.getElementById('result-screen').style.display = 'none';
                toggleLeaderboard(true);
            })
            .catch((err) => {
                console.error("Gagal menyimpan skor ke Firebase:", err);
                alert("Gagal menyimpan skor. Cek Rules Firebase milikmu.");
                document.getElementById('result-screen').style.display = 'none';
                document.getElementById('main-menu').style.display = 'flex';
            });
    } catch(e) {
        console.error("Error Firebase:", e);
        document.getElementById('result-screen').style.display = 'none';
        document.getElementById('main-menu').style.display = 'flex';
    }
}

function toggleLeaderboard(show) {
    const modal = document.getElementById('leaderboard-modal');
    const mainMenu = document.getElementById('main-menu');
    
    if (show) {
        if (mainMenu) mainMenu.style.display = 'none';
        if (modal) modal.style.display = 'flex';
        fetchGlobalScores();
    } else {
        if (modal) modal.style.display = 'none';
        if (mainMenu) mainMenu.style.display = 'flex';
    }
}

function fetchGlobalScores() {
    const listEl = document.getElementById('leaderboard-list');
    if (!listEl) return;

    listEl.innerHTML = "<p style='text-align:center;'>Memuat data global...</p>";

    if (!isFirebaseReady) {
        listEl.innerHTML = "<p style='text-align:center; color:red;'>Koneksi ke Firebase gagal.</p>";
        return;
    }

    try {
        firebase.database().ref('leaderboard').once('value', (snapshot) => {
            let dataArr = [];
            snapshot.forEach(child => { 
                dataArr.push(child.val()); 
            });

            dataArr.sort((a, b) => b.score - a.score);

            if (dataArr.length === 0) {
                listEl.innerHTML = "<p style='text-align:center;'>Belum ada skor global tersimpan.</p>";
                return;
            }

            let html = "";
            dataArr.slice(0, 10).forEach((item, index) => {
                html += `
                    <div style="display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px solid #eee; font-size:14px;">
                        <span>#${index+1} <b>${item.username || 'Player'}</b></span>
                        <span style="color:var(--accent-color); font-weight:bold;">${(item.score || 0).toLocaleString()}</span>
                    </div>
                `;
            });
            listEl.innerHTML = html;
        }, (error) => {
            console.error("Firebase fetch error:", error);
            listEl.innerHTML = "<p style='text-align:center; color:red;'>Gagal memuat leaderboard global.</p>";
        });
    } catch(e) {
        console.error("Exception:", e);
        listEl.innerHTML = "<p style='text-align:center; color:red;'>Terjadi kesalahan koneksi.</p>";
    }
}

// Jalankan Event Listener saat halaman dimuat
document.addEventListener('DOMContentLoaded', () => {
    setupTouchEvents();
});
</script>
