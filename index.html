    <meta charset="UTF-8">

    <title>TUH WWW</title>
    
    <style>
        @font-face {
            font-family: 'Hillios';
            src: url('Hillios.otf') format('opentype');
        }

        h1 {
            font-family: 'Hillios', sans-serif !important;
        }

        :root {
            --accent-color: #e95500;
            --bg-color: #f6f6f9;
            --text-color: #555555;
            --lane-color: #ffee9b;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Poppins', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #game-container {
            width: 100vw;
            height: 100vh;
            max-width: 480px;
            max-height: 100vh;
            background: #ffffff;
            position: relative;
            box-shadow: 0 0 30px rgba(0,0,0,0.08);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .logo-wrapper {
            width: 130px;
            height: 130px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 15px;
        }

        .logo-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            filter: drop-shadow(0 4px 10px rgba(233, 85, 0, 0.3));
        }

        #main-menu, #result-screen, #leaderboard-modal {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(8px);
            z-index: 9999 !important;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        #game-screen {
            display: none;
            width: 100%;
            height: 100%;
            position: relative;
        }

        .btn {
            background: var(--accent-color);
            color: white;
            border: none;
            padding: 14px 28px;
            font-size: 16px;
            font-weight: 800;
            border-radius: 25px;
            cursor: pointer !important;
            pointer-events: auto !important;
            box-shadow: 0 8px 15px rgba(233, 85, 0, 0.3);
            transition: transform 0.1s;
            margin: 8px 0;
            width: 80%;
            max-width: 250px;
            text-align: center;
            position: relative;
            z-index: 10000 !important;
            font-family: 'Poppins', sans-serif;
        }

        .btn:active { transform: scale(0.95); }

        .hud {
            position: absolute;
            top: 20px; left: 20px; right: 20px;
            display: flex;
            justify-content: space-between;
            font-weight: 800;
            font-size: 18px;
            color: var(--accent-color);
            z-index: 10;
        }

        #judgment-text {
            position: absolute;
            top: 40%; left: 50%;
            transform: translate(-50%, -50%);
            font-size: 32px;
            font-weight: 900;
            opacity: 0;
            transition: opacity 0.1s;
            z-index: 10;
            pointer-events: none;
        }

        .track-container {
            display: flex;
            width: 100%;
            height: 100%;
            position: relative;
        }

        .lane {
            flex: 1;
            border-right: 1px dashed #eee;
            position: relative;
            height: 100%;
            overflow: hidden;
        }

        .lane:last-child { border-right: none; }

        .heart-key {
            position: absolute;
            bottom: 120px;
            left: 50%;
            transform: translateX(-50%);
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: 3px solid var(--accent-color);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            color: var(--accent-color);
            background: white;
            box-shadow: 0 4px 10px rgba(233, 85, 0, 0.2);
        }

        .heart-key.active-press {
            background: var(--accent-color) !important;
            color: white !important;
            transform: translateX(-50%) scale(1.15) !important;
            box-shadow: 0 0 20px var(--accent-color) !important;
            transition: transform 0.05s ease, background 0.05s ease;
        }
        
        .note {
            position: absolute;
            width: 36px;
            height: 36px;
            left: calc(50% - 18px);
            background: var(--accent-color);
            border-radius: 50%;
            box-shadow: 0 0 10px rgba(233, 85, 0, 0.5);
            animation: fall 1.5s linear forwards;
        }

        @keyframes fall {
            0% { top: -40px; }
            100% { top: 100%; }
        }

        .result-box {
            background: #ffffff;
            border: 2px solid #f0f0f5;
            padding: 30px 24px;
            border-radius: 30px;
            width: 85%;
            max-width: 360px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(233, 85, 0, 0.15);
        }

        .score-big {
            font-size: 36px;
            font-weight: 900;
            margin: 5px 0 15px 0;
            color: var(--accent-color);
        }

        .stats-container {
            display: flex;
            justify-content: space-between;
            gap: 8px;
            margin-bottom: 20px;
        }

        .stat-pill {
            flex: 1;
            padding: 10px 4px;
            border-radius: 15px;
            font-size: 11px;
            font-weight: 800;
            background: #f8f8fc;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .stat-pill span { font-size: 18px; }
        .stat-pill.perfect { color: #e95500; }
        .stat-pill.good { color: #ffb800; }
        .stat-pill.miss { color: #888888; }

            font-family: 'Poppins', sans-serif;
        }

        #username-input:focus {
            border-color: var(--accent-color);
            background: #fff;
        }

// 3. FUNGSI LOGIKA GAME
// ==========================================
function startGame() {
    const mainMenu = document.getElementById('main-menu');
    const resultScreen = document.getElementById('result-screen');
    const leaderboardModal = document.getElementById('leaderboard-modal');
    const gameScreen = document.getElementById('game-screen');

    if (mainMenu) mainMenu.style.display = 'none';
    if (resultScreen) resultScreen.style.display = 'none';
    if (leaderboardModal) leaderboardModal.style.display = 'none';
    if (gameScreen) gameScreen.style.display = 'block';
    
    score = 0;
    combo = 0;
    perfectCount = 0;
    goodCount = 0;
    missCount = 0;
    
    document.querySelectorAll('.note').forEach(n => n.remove());
    beatmapData.forEach(n => n.spawned = false);

    isPlaying = true;
    update();

    if (bgm) {
        bgm.currentTime = 0;
        bgm.play().catch(() => {});
    }

    if (gameInterval) clearInterval(gameInterval);
    const startTime = Date.now();

    gameInterval = setInterval(() => {
        if (!isPlaying) return;

        const elapsedTime = Date.now() - startTime;

        beatmapData.forEach(note => {
            if (!note.spawned && elapsedTime >= note.timestamp) {
                spawnNoteDOM(note.lane);
                note.spawned = true;
            }
        });

        document.querySelectorAll('.note').forEach(noteEl => {
            const rect = noteEl.getBoundingClientRect();
            if (rect.top > window.innerHeight - 50) {
                noteEl.remove();
                triggerJudgment('MISS');
            }
        });

        if (elapsedTime >= 60000) {
            endGame('congrats');
        }
    }, 50);
}

function spawnNoteDOM(laneIndex) {
    const lanes = document.querySelectorAll('.lane');
    if (!lanes[laneIndex]) return;

    const noteEl = document.createElement('div');
    noteEl.className = 'note';
    lanes[laneIndex].appendChild(noteEl);
}

function hitLane(laneIndex) {
    if (!isPlaying) return;

    const lanes = document.querySelectorAll('.lane');
    const currentLane = lanes[laneIndex];
    if (!currentLane) return;

    const heartKey = currentLane.querySelector('.heart-key');
    if (heartKey) {
        heartKey.classList.add('active-press');
        setTimeout(() => {
            heartKey.classList.remove('active-press');
        }, 100);
    }

    const activeNotes = currentLane.querySelectorAll('.note');
    if (activeNotes.length === 0) return;

    const targetNote = activeNotes[0];
    if (!targetNote || !heartKey) return;

    const noteRect = targetNote.getBoundingClientRect();
    const heartRect = heartKey.getBoundingClientRect();

    const noteCenter = noteRect.top + (noteRect.height / 2);
    const heartCenter = heartRect.top + (heartRect.height / 2);
    const distance = Math.abs(noteCenter - heartCenter);

    if (distance <= 30) {
        targetNote.remove();
        triggerJudgment('PERFECT');
    } else if (distance <= 65) {
        targetNote.remove();
        triggerJudgment('GOOD');
    }
}

function triggerJudgment(type) {
    const el = document.getElementById('judgment-text');
    
    if (type === 'PERFECT') {
        if (el) {
            el.innerText = 'PERFECT';
            el.style.color = '#e95500';
            el.style.opacity = '1';
            setTimeout(() => { el.style.opacity = '0'; }, 200);
        }
        score += 100;
        combo++;
        perfectCount++;
    } else if (type === 'GOOD') {
        if (el) {
            el.innerText = 'GOOD';
            el.style.color = '#ffb800';
            el.style.opacity = '1';
            setTimeout(() => { el.style.opacity = '0'; }, 200);
        }
        score += 50;
        combo++;
        goodCount++;
    } else {
        if (el) {
            el.innerText = 'MISS';
            el.style.color = '#888888';
            el.style.opacity = '1';
            setTimeout(() => { el.style.opacity = '0'; }, 200);
        }
        combo = 0;
        missCount++;

        if (missCount >= 15) {
            endGame('gameover');
            return;
        }
    }

    update();
}

function update() {
    const scoreEl = document.getElementById('score');
    const comboEl = document.getElementById('combo');
    if (scoreEl) scoreEl.innerText = score.toLocaleString();
    if (comboEl) comboEl.innerText = combo;
}

function endGame(status) {
    isPlaying = false;
    clearInterval(gameInterval);
    if (bgm) bgm.pause();

    document.getElementById('game-screen').style.display = 'none';
    
    const titleEl = document.getElementById('result-title');
    if (status === 'congrats') {
        titleEl.innerText = "CONGRATS!";
    } else {
        titleEl.innerText = "GAME OVER";
    }

    document.getElementById('res-score').innerText = score.toLocaleString();
    document.getElementById('res-perfect').innerText = perfectCount;
    document.getElementById('res-good').innerText = goodCount;
    document.getElementById('res-miss').innerText = missCount;
    
    const inputEl = document.getElementById('username-input');
    if (inputEl) inputEl.value = '';
    
    document.getElementById('result-screen').style.display = 'flex';
}

// 4. FIREBASE SAVE & FETCH LEADERBOARD

function saveScoreAndExit() {
    const inputEl = document.getElementById('username-input');
    const username = (inputEl && inputEl.value.trim() !== "") ? inputEl.value.trim() : "Player";

    const scoreData = {
        username: username,
        score: score,
        perfect: perfectCount,
        good: goodCount,
        miss: missCount,
        timestamp: Date.now()
    };

    if (!isFirebaseReady) {
        document.getElementById('result-screen').style.display = 'none';
        document.getElementById('main-menu').style.display = 'flex';
        return;
    }

    try {
        firebase.database().ref('leaderboard').push(scoreData)
            .then(() => {
                document.getElementById('result-screen').style.display = 'none';
                toggleLeaderboard(true);
            })
            .catch((err) => {
                console.error("Gagal menyimpan skor ke Firebase:", err);
                alert("Gagal menyimpan skor. Cek Rules Firebase milikmu.");
                document.getElementById('result-screen').style.display = 'none';
                document.getElementById('main-menu').style.display = 'flex';
            });
    } catch(e) {
        console.error("Error Firebase:", e);
        document.getElementById('result-screen').style.display = 'none';
        document.getElementById('main-menu').style.display = 'flex';
    }
}

function toggleLeaderboard(show) {
    const modal = document.getElementById('leaderboard-modal');
    const mainMenu = document.getElementById('main-menu');
    
    if (show) {
        if (mainMenu) mainMenu.style.display = 'none';
        if (modal) modal.style.display = 'flex';
        fetchGlobalScores();
    } else {
        if (modal) modal.style.display = 'none';
        if (mainMenu) mainMenu.style.display = 'flex';
    }
}

function fetchGlobalScores() {
    const listEl = document.getElementById('leaderboard-list');
    if (!listEl) return;

    listEl.innerHTML = "<p style='text-align:center;'>Memuat data global...</p>";

    if (!isFirebaseReady) {
        listEl.innerHTML = "<p style='text-align:center; color:red;'>Koneksi ke Firebase gagal.</p>";
        return;
    }

    try {
        firebase.database().ref('leaderboard').once('value', (snapshot) => {
            let dataArr = [];
            snapshot.forEach(child => { 
                dataArr.push(child.val()); 
            });

            dataArr.sort((a, b) => b.score - a.score);

            if (dataArr.length === 0) {
                listEl.innerHTML = "<p style='text-align:center;'>Belum ada skor global tersimpan.</p>";
                return;
            }

            let html = "";
            dataArr.slice(0, 10).forEach((item, index) => {
                html += `
                    <div style="display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px solid #eee; font-size:14px;">
                        <span>#${index+1} <b>${item.username || 'Player'}</b></span>
                        <span style="color:var(--accent-color); font-weight:bold;">${(item.score || 0).toLocaleString()}</span>
                    </div>
                `;
            });
            listEl.innerHTML = html;
        }, (error) => {
            console.error("Firebase fetch error:", error);
            listEl.innerHTML = "<p style='text-align:center; color:red;'>Gagal memuat leaderboard global.</p>";
        });
    } catch(e) {
        console.error("Exception:", e);
        listEl.innerHTML = "<p style='text-align:center; color:red;'>Terjadi kesalahan koneksi.</p>";
    }
}
</script>
